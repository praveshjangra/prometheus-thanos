apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring-manual
type: Opaque
stringData:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m

    route:
      receiver: default-receiver
      group_by: ['alertname', 'team', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      routes:
      # Payments team — critical pages (PagerDuty / Slack in prod)
      - matchers:
        - team="payments"
        receiver: team-payments
        group_wait: 30s
        repeat_interval: 1h
        continue: false
      # Order team
      - matchers:
        - team="order"
        receiver: team-order
        group_wait: 30s
        repeat_interval: 1h
        continue: false
      # Warnings without a team route fall through to default-receiver

    inhibit_rules:
    - source_matchers:
      - alertname="StatusWebTargetDown"
      target_matchers:
      - alertname="StatusWebHigh5xxRate"
      equal: ['job', 'namespace', 'team']
    - source_matchers:
      - severity="critical"
      target_matchers:
      - severity="warning"
      equal: ['alertname', 'namespace', 'team']

    receivers:
    - name: default-receiver
      # Lab: alerts visible in Alertmanager UI (/api/v2/alerts) even without a real webhook
      webhook_configs:
      - url: http://127.0.0.1:1/unrouted
        send_resolved: true
    - name: team-payments
      slack_configs:
      - api_url: https://hooks.slack.com/services/REPLACE/PAYMENTS/WEBHOOK
        channel: '#alerts-payments'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: |
          Team: {{ .GroupLabels.team }}
          Namespace: {{ .GroupLabels.namespace }}
          {{ range .Alerts.Firing }}• {{ .Annotations.summary }}
          {{ end }}
    - name: team-order
      slack_configs:
      - api_url: https://hooks.slack.com/services/REPLACE/ORDER/WEBHOOK
        channel: '#alerts-order'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: |
          Team: {{ .GroupLabels.team }}
          Namespace: {{ .GroupLabels.namespace }}
          {{ range .Alerts.Firing }}• {{ .Annotations.summary }}
          {{ end }}
