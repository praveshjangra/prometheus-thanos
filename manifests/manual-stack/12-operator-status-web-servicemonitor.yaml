apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: status-web
  namespace: default
  labels:
    release: manual-operator
spec:
  namespaceSelector:
    matchNames:
    - default
  selector:
    matchLabels:
      app: status-web
  endpoints:
  - port: http-metrics   # must match Service port name (prod service uses http-metrics, not http)
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: false
